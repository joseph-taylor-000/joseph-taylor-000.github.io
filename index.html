<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="website/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Website</title>
</head>
<body>
  <section class="rocket-banner" id="rocketBanner" aria-label="Interactive rocket banner">

    <!-- Decorative SVG assets -->
    <img src="icons/star.svg" class="banner-star star-one" alt="">
    <img src="icons/star2.svg" class="banner-star star-two" alt="">
    <img src="icons/star.svg" class="banner-star star-three" alt="">
    <img src="icons/star_ring.svg" class="banner-star star-four" alt="">

    <!-- Banner content -->
    <div class="banner-content">
        <span class="banner-eyebrow">Joseph Taylor</span>
    </div>

    <!-- Projectile rendering layer -->
    <canvas class="rocket-canvas" id="rocketCanvas"></canvas>

    <!-- Rocket -->
    <img
        src="icons/rocket.svg"
        id="rocket"
        class="rocket"
        alt=""
        draggable="false"
    />

</section>

  <script src="website/rocket-banner.js"></script>
</body>
</html>
